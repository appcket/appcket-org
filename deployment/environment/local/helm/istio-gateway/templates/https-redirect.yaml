apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: global-https-redirect
  namespace: {{ .Values.ingress.namespace }}
spec:
  parentRefs:
  - name: {{ .Values.ingress.namespace }}-gateway
    namespace: {{ .Values.ingress.namespace }}
    sectionName: http # Attach to the HTTP listener
  hostnames:
  - "{{ .Values.domain }}.{{ .Values.tld }}"
  - "*.{{ .Values.domain }}.{{ .Values.tld }}"
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
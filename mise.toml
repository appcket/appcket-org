[tasks.bootstrap]
description = "Full initial setup (Day 0) - Runs steps sequentially"
run = '''
#!/bin/bash
set -e

echo "📦 Checking system dependencies..."
mise run setup:sys-deps

echo "📦 Installing tools..."
mise install

echo "📝 Renaming project placeholders..."
mise run setup:rename

echo "📄 Initializing env files..."
mise run setup:env-files

echo "🐳 Starting Infrastructure (Docker)..."
mise run infra:up

echo "🏗️  Building and Pushing Images..."
mise run build

echo "☸️  Initializing Kubernetes Namespace & Secrets..."
mise run k8s:init

echo "🕸️  Deploying Infrastructure (Redpanda, Istio)..."
mise run k8s:deploy-infra

echo "🚀 Deploying Bootstrap Namespace..."
mise run k8s:deploy-bootstrap-namespace

echo "🗄️ Initializing Databases..."
mise run db:init

echo "🌱 Seeding Data..."
mise run db:seed

echo "🔐 Setting up Local Trust..."
mise run setup:trust-ca

echo "✅ Bootstrap Complete! Run 'mise run start' to begin development."
'''

[tasks.start]
description = "Start daily dev session"
run = '''
#!/bin/bash
set -e
echo "🚀 Starting development environment..."

# 1. Bind Mount (WSL specific)
echo "🪜 Ensuring WSL bind mount..."
sudo mkdir -p /mnt/wsl/rancher-desktop-bind-mounts/dev
sudo mount --bind $HOME/dev /mnt/wsl/rancher-desktop-bind-mounts/dev || true

# 2. Configure CoreDNS
mise run k8s:patch-coredns

kubectl rollout restart daemonset ztunnel -n istio-system
kubectl delete pod -n appcket -l app=waypoint
kubectl rollout restart deployment istio-system-gateway-istio -n istio-system

# 3. Set kubectl context
kubectl config set-context --current --namespace=${PROJECT_MACHINE_NAME}

# 4. Database and Registry containers (with build)
echo "🪜 Starting Database and Registry containers..."
docker compose -f deployment/environment/local/docker-compose.yml -p ${PROJECT_MACHINE_NAME} up --build -d

# 5. Delete existing instance for clean slate
echo "🪜 Deleting existing helm release..."
helm delete ${PROJECT_MACHINE_NAME} -n ${PROJECT_MACHINE_NAME} || true

# 6. Package and Install Chart (proven way)
echo "🪜 Packaging and Installing Helm chart..."
helm package "deployment/environment/local/helm/appcket" -d "deployment/environment/local"
helm install ${PROJECT_MACHINE_NAME} "deployment/environment/local/${PROJECT_MACHINE_NAME}-0.1.0.tgz" \
    -n ${PROJECT_MACHINE_NAME} \
    -f deployment/environment/local/helm/appcket/values.yaml

echo "⏳ Waiting for main-outbox-watcher to be ready..."
kubectl rollout status deployment/main-outbox-watcher -n ${PROJECT_MACHINE_NAME} --timeout=300s

echo "✅ Local dev environment running!"
'''


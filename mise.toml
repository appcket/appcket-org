[tasks."db:init"]
description = "Initialize Databases (Schemas, Dumps, Sequin Slots)"
run = '''
#!/bin/bash
set -e
echo "🪜 Initializing Database Schemas..."

# Ensure DBs exist
for db in "${PROJECT_MACHINE_NAME}" "sequin" "keycloak"; do
    exists=$(psql -tAc "SELECT 1 FROM pg_database WHERE datname='$db'" "dbname=postgres user=${DATABASE_USER} password=${DATABASE_PASSWORD} host=localhost" || true)
    if [ "$exists" != "1" ]; then
        echo "🪜 Creating database $db..."
        psql -c "CREATE DATABASE $db WITH ENCODING 'UTF8'" "dbname=postgres user=${DATABASE_USER} password=${DATABASE_PASSWORD} host=localhost"
    fi
done

# Schema and Dumps
psql -c "CREATE SCHEMA IF NOT EXISTS ${PROJECT_MACHINE_NAME}" "dbname=${PROJECT_MACHINE_NAME} user=${DATABASE_USER} password=${DATABASE_PASSWORD} host=localhost"
psql -f "deployment/environment/local/keycloak_dump.sql" "dbname=keycloak user=${DATABASE_USER} password=${DATABASE_PASSWORD} host=localhost"

# Sequin Setup (Destructive Reset)
echo "🪜 Setting up Sequin replication slot..."
psql -c "SELECT pg_terminate_backend(active_pid) FROM pg_replication_slots WHERE slot_name = 'sequin_slot';" "dbname=${PROJECT_MACHINE_NAME} user=${DATABASE_USER} password=${DATABASE_PASSWORD} host=localhost" || true
psql -c "SELECT pg_drop_replication_slot('sequin_slot') WHERE EXISTS (SELECT 1 FROM pg_replication_slots WHERE slot_name = 'sequin_slot');" "dbname=${PROJECT_MACHINE_NAME} user=${DATABASE_USER} password=${DATABASE_PASSWORD} host=localhost" || true
psql -c "SELECT pg_create_logical_replication_slot('sequin_slot', 'pgoutput')" "dbname=${PROJECT_MACHINE_NAME} user=${DATABASE_USER} password=${DATABASE_PASSWORD} host=localhost"
psql -c "DROP PUBLICATION IF EXISTS sequin_pub" "dbname=${PROJECT_MACHINE_NAME} user=${DATABASE_USER} password=${DATABASE_PASSWORD} host=localhost"
psql -c "CREATE PUBLICATION sequin_pub FOR ALL TABLES" "dbname=${PROJECT_MACHINE_NAME} user=${DATABASE_USER} password=${DATABASE_PASSWORD} host=localhost"

# ClickHouse
mise run db:setup-clickhouse
'''

[tasks."db:setup-clickhouse"]
description = "Configure ClickHouse schema and Kafka ingestion"
run = '''
#!/bin/bash
set -e
echo "🪜 Setting up ClickHouse..."

run_query() {
    curl -s -u "${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}" "${CLICKHOUSE_HOST}" -d "$1"
}

run_query "CREATE DATABASE IF NOT EXISTS appcket"
run_query "DROP TABLE IF EXISTS appcket.outbox_events_mv"
run_query "DROP TABLE IF EXISTS appcket.outbox_events_history"
run_query "DROP TABLE IF EXISTS appcket.outbox_events_queue"

run_query "CREATE TABLE appcket.outbox_events_history (
    id String,
    action String,
    table_schema String,
    table_name String,
    correlation_id UUID,
    entity_id String,
    entity_type String,
    user_id String,
    payload String,
    committed_at DateTime64(3),
    ingested_at DateTime DEFAULT now()
) ENGINE = MergeTree ORDER BY (entity_type, entity_id, committed_at)"

KAFKA_PORT=$(kubectl get svc -n redpanda redpanda-external -o jsonpath='{.spec.ports[?(@.name=="kafka-default")].nodePort}')
echo "Detected Redpanda External Port: $KAFKA_PORT"

run_query "CREATE TABLE appcket.outbox_events_queue (
    record String,
    action String,
    metadata String
) ENGINE = Kafka SETTINGS kafka_broker_list = 'host.docker.internal:${KAFKA_PORT}',
         kafka_topic_list = 'outbox-events',
         kafka_group_name = 'clickhouse_consumer',
         kafka_format = 'JSONEachRow',
         kafka_skip_broken_messages = 1"

run_query "CREATE MATERIALIZED VIEW appcket.outbox_events_mv TO appcket.outbox_events_history AS
SELECT
    JSONExtractString(record, 'id') as id,
    action,
    JSONExtractString(metadata, 'table_schema') as table_schema,
    JSONExtractString(metadata, 'table_name') as table_name,
    toUUIDOrZero(JSONExtractString(record, 'correlation_id')) as correlation_id,
    JSONExtractString(record, 'payload', 'entity', 'id') as entity_id,
    JSONExtractString(record, 'payload', 'entity', 'type') as entity_type,
    JSONExtractString(record, 'payload', 'user', 'id') as user_id,
    JSONExtractString(record, 'payload') as payload,
    parseDateTime64BestEffortOrNull(JSONExtractString(metadata, 'commit_timestamp')) as committed_at
FROM appcket.outbox_events_queue"

echo "✅ ClickHouse configured."
'''

[tasks."db:seed"]
description = "Seed application data"
dir = "deployment/database"
run = '''
pnpm install
export DB_ADDR=localhost DB_PORT=5432 DB_USER=${DATABASE_USER} DB_PASSWORD=${DATABASE_PASSWORD} DB_NAME=${PROJECT_MACHINE_NAME}
pnpm run schema-seed
pnpm run post-seed
'''


[tasks."k8s:init"]
description = "Initialize K8s namespace, secrets, and DNS"
run = '''
#!/bin/bash
set -e
echo "🪜 Initializing K8s Namespace & Secrets..."
kubectl create namespace ${PROJECT_MACHINE_NAME} || true
kubectl label namespace ${PROJECT_MACHINE_NAME} istio.io/dataplane-mode=ambient --overwrite
kubectl label namespace ${PROJECT_MACHINE_NAME} istio.io/use-waypoint=waypoint --overwrite

# CoreDNS Patch
mise run k8s:patch-coredns

# Secrets
kubectl create secret generic database-secret --from-literal=user=${DATABASE_USER} --from-literal=password=${DATABASE_PASSWORD} -n ${PROJECT_MACHINE_NAME} --dry-run=client -o yaml | kubectl apply -f -
kubectl create secret generic api-keycloak-client-secret --from-literal=clientsecret=${API_CLIENT_KEYCLOAK_SECRET} -n ${PROJECT_MACHINE_NAME} --dry-run=client -o yaml | kubectl apply -f -
kubectl create secret generic app-keycloak-client-secret --from-literal=clientsecret=${APP_CLIENT_KEYCLOAK_SECRET} -n ${PROJECT_MACHINE_NAME} --dry-run=client -o yaml | kubectl apply -f -
kubectl create secret generic clickhouse-secret --from-literal=user=${CLICKHOUSE_USER} --from-literal=password=${CLICKHOUSE_PASSWORD} -n ${PROJECT_MACHINE_NAME} --dry-run=client -o yaml | kubectl apply -f -
'''

[tasks."k8s:patch-coredns"]
description = "Configure CoreDNS for .test domain resolution"
run = '''
#!/bin/bash
set -e
echo "📡 Patching CoreDNS..."

EXISTING_NODE_HOSTS=$(kubectl get configmap coredns -n kube-system -o jsonpath='{.data.NodeHosts}')
NODE_HOSTS_CONTENT="$EXISTING_NODE_HOSTS"
HOST_IP=$(echo "$EXISTING_NODE_HOSTS" | awk '{print $1}' | head -n 1)

if [[ "$NODE_HOSTS_CONTENT" != *"host.docker.internal"* ]]; then
    NODE_HOSTS_CONTENT="${NODE_HOSTS_CONTENT}
${HOST_IP} host.docker.internal"
fi

INDENTED_NODE_HOSTS=$(echo "$NODE_HOSTS_CONTENT" | sed 's/^/    /')

cat <<EOF | kubectl apply -f -
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health
        rewrite name accounts.${DOMAIN} ${GATEWAY_SVC}
        rewrite name appcket.${DOMAIN} ${GATEWAY_SVC}
        rewrite name api.${DOMAIN} ${GATEWAY_SVC}
        rewrite name app.${DOMAIN} ${GATEWAY_SVC}
        rewrite name redpanda.${DOMAIN} ${GATEWAY_SVC}
        rewrite name sequin.${DOMAIN} ${GATEWAY_SVC}
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
        }
        hosts /etc/coredns/NodeHosts {
          ttl 60
          reload 15s
          fallthrough
        }
        prometheus :9153
        cache 30
        loop
        reload
        loadbalance
        import /etc/coredns/custom/*.override
        forward . /etc/resolv.conf
    }
    import /etc/coredns/custom/*.server
  NodeHosts: |
${INDENTED_NODE_HOSTS}
EOF

kubectl rollout restart deployment coredns -n kube-system
echo "✅ CoreDNS patched."
'''

[tasks."k8s:deploy-infra"]
description = "Deploy Istio, Cert-Manager and Redpanda"
run = '''
#!/bin/bash
set -e
echo "🪜 Deploying Infrastructure Charts..."

# 1. Install Istio
echo "🪜 Installing Istio..."
helm repo add istio https://istio-release.storage.googleapis.com/charts && helm repo update
helm upgrade --install istio-base istio/base -n istio-system --create-namespace
kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.4.0/experimental-install.yaml
helm upgrade --install istiod istio/istiod --namespace istio-system --set profile=ambient \
    --set "pilot.env.PILOT_ENABLE_GATEWAY_API=true" \
    --set "pilot.env.PILOT_ENABLE_GATEWAY_API_DEPLOYMENT_CONTROLLER=true"
helm upgrade --install istio-cni istio/cni -n istio-system --set profile=ambient --set global.platform=k3s
helm upgrade --install ztunnel istio/ztunnel -n istio-system

# 2. Install Cert-Manager
echo "🪜 Installing Cert-Manager..."
helm repo add jetstack https://charts.jetstack.io
helm repo update
helm upgrade --install cert-manager jetstack/cert-manager \
    --namespace cert-manager \
    --create-namespace \
    --version v1.20.2 \
    --set crds.enabled=true \
    --set securityContext.runAsNonRoot=false \
    --set webhook.securityContext.runAsNonRoot=false \
    --set cainjector.securityContext.runAsNonRoot=false \
    --set startupapicheck.securityContext.runAsNonRoot=false

# 3. Install Redpanda Operator
echo "🪜 Installing Redpanda Operator..."
helm repo add redpanda https://charts.redpanda.com
helm repo update
helm upgrade --install redpanda-controller redpanda/operator \
--namespace redpanda \
--create-namespace \
--version 26.1.3 \
--set crds.enabled=true

kubectl rollout status deployment/redpanda-controller-operator -n redpanda --timeout=120s

# 4. Deploy Local Redpanda Cluster
echo "🪜 Deploying Redpanda Cluster..."
helm upgrade --install redpanda deployment/environment/local/helm/redpanda \
  -f deployment/environment/local/helm/redpanda/values.yaml \
  -n redpanda \
  --create-namespace
kubectl label namespace redpanda istio.io/dataplane-mode=ambient --overwrite || true

# 5. Start Istio Gateway
echo "🪜 Starting Istio Gateway..."
helm upgrade --install istio-gateway "deployment/environment/local/helm/istio-gateway" \
-n istio-system \
-f "deployment/environment/local/helm/istio-gateway/values.yaml" || true

kubectl apply -f deployment/environment/local/helm/issuers.yaml

echo "🪜 Waiting for root-ca-secret..."
for i in {1..30}; do
    if kubectl get secret root-ca-secret -n cert-manager >/dev/null 2>&1; then
        echo "root-ca-secret found, copying..."

        kubectl delete secret root-ca-secret -n ${PROJECT_MACHINE_NAME} --ignore-not-found

        kubectl get secret root-ca-secret -n cert-manager -o yaml \
        | sed "s/namespace: cert-manager/namespace: ${PROJECT_MACHINE_NAME}/" \
        | sed '/resourceVersion/d' \
        | sed '/uid/d' \
        | kubectl apply -f - || true
        break
    fi
    echo "Waiting for root-ca-secret... ($i/30)"
    sleep 1
done
'''

[tasks."k8s:deploy-bootstrap-namespace"]
description = "Deploy Bootstrap Namespace Chart"
run = '''
#!/bin/bash
set -e
# Calculate Host Mount Path ( proven way for bootstrap)
CURRENT_DIR=$(pwd)
if grep -q "Microsoft" /proc/version; then
    RELATIVE_PATH=$(echo "$CURRENT_DIR" | sed 's|.*/dev/||')
    HOST_MOUNT_PATH="/mnt/wsl/rancher-desktop-bind-mounts/dev/${RELATIVE_PATH}"
else
    HOST_MOUNT_PATH="${CURRENT_DIR}"
fi

helm upgrade --install bootstrap-namespace deployment/environment/local/helm/bootstrap-namespace \
    -n ${PROJECT_MACHINE_NAME} \
    -f deployment/environment/local/helm/bootstrap-namespace/values-appcket.yaml \
    --set api.hostPath="${HOST_MOUNT_PATH}/api" \
    --set app.hostPath="${HOST_MOUNT_PATH}/app" \
    --set marketing.hostPath="${HOST_MOUNT_PATH}/marketing"
'''


[tasks."setup:trust-ca"]
description = "Extract and setup instructions for trusting the local CA"
run = 'deployment/environment/local/trust-local-ca.sh'

[tasks."setup:rename"]
description = "Rename 'appcket' placeholders to project name"
run = '''
#!/bin/bash
replace_if_matches() {
  pattern="$1"
  sed_expr="$2"
  matches=$(grep -Irl --exclude='mise.toml' --exclude-dir='.git' --exclude-dir='.ignore' --exclude-dir='node_modules' --exclude-dir='dist' --exclude-dir='build' -e "$pattern" . || true)
  if [ -n "$matches" ]; then
    printf "%s" "$matches" | tr '\n' '\0' | xargs -0 sed -i -- "$sed_expr"
  else
    echo "No matches for ${pattern}"
  fi
}
replace_if_matches 'appcket' "s/appcket/${PROJECT_MACHINE_NAME}/g"
replace_if_matches 'Appcket' "s/Appcket/${PROJECT_HUMAN_NAME}/g"
replace_if_matches 'Ch@ng3To@StrongP@ssw0rd' "s|Ch@ng3To@StrongP@ssw0rd|${DATABASE_PASSWORD}|g"
'''

[tasks."setup:sys-deps"]
description = "Install system dependencies (apt)"
run = '''
#!/bin/bash
if ! command -v psql &> /dev/null; then
    sudo apt update && sudo apt install -y postgresql-client
else
    echo "✅ psql is already installed."
fi
'''

[tasks."setup:env-files"]
description = "Initialize .env files"
run = '''
#!/bin/bash
mv -n "app/dot.env.local" "app/.env.local" || true
mv -n "app/dot.env.production" "app/.env.production" || true
mv -n "marketing/dot.env.local" "marketing/.env.local" || true
mv -n "marketing/dot.env.production" "marketing/.env.production" || true
'''

# -----------------------------------------------------------------------------
# Infrastructure Tasks
# -----------------------------------------------------------------------------

[tasks."infra:volumes"]
description = "Create Docker volumes"
run = '''
docker volume create --name ${PROJECT_MACHINE_NAME}-database -d local || true
docker volume create --name ${PROJECT_MACHINE_NAME}-registry-data -d local || true
docker volume create --name ${PROJECT_MACHINE_NAME}-clickhouse-data -d local || true
docker volume create --name ${PROJECT_MACHINE_NAME}-redis-data -d local || true
'''

[tasks."infra:up"]
description = "Start Docker dependencies"
depends = ["infra:volumes"]
run = 'docker compose -f deployment/environment/local/docker-compose.yml -p ${PROJECT_MACHINE_NAME} up -d'

[tasks.build]
description = "Build and push images"
run = "deployment/environment/local/build.sh -e local"
